<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jenny 的冒险 - 女孩版马里奥</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrap">
    <h1>🌸 Jenny 的冒险 🌸</h1>
    <div class="hud">
      <span id="hud-score">爱心: 0</span>
      <span id="hud-lives">生命: 3</span>
      <span id="hud-level">关卡: 1</span>
    </div>
    <canvas id="game" width="800" height="480"></canvas>
    <div class="controls">
      <p><strong>操作：</strong> ← → 或 A D 移动，↑ 或 W 或 空格 跳跃，R 重新开始</p>
      <p>收集爱心 💖，躲开史莱姆 👾，或者跳到它头上消灭它，到达粉色旗子获胜！</p>
    </div>
    <div id="overlay" class="overlay hidden">
      <div class="overlay-card">
        <h2 id="overlay-title">游戏结束</h2>
        <p id="overlay-text"></p>
        <button id="overlay-btn">再玩一次</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
